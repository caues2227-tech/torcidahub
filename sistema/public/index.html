<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070c" />
  <meta name="description" content="Portal do torcedor: notícias, jogos ao vivo e sua nação em um só lugar." />
  <meta property="og:title" content="Torcida. — Monte sua nação" />
  <meta property="og:description" content="Portal do torcedor: notícias, jogos ao vivo e sua nação em um só lugar." />
  <title>Torcida. — Monte sua nação</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/archivo-latin-wght-normal.woff2" />
  <link rel="stylesheet" href="/css/fonts.css?v=27" />
  <link rel="stylesheet" href="/estilos.css?v=27" />
  <link rel="stylesheet" href="/css/tokens.css?v=27" />
  <link rel="stylesheet" href="/css/base.css?v=27" />
  <link rel="stylesheet" href="/css/portal.css?v=27" />
  <script src="/tema.js?v=27"></script>
  <script>
    /* Boot imediato: começa o fetch do portal no head, sem depender de app.js */
    (function () {
      var time = "Santos";
      try {
        var prefs = JSON.parse(localStorage.getItem("torcida.prefs") || "null");
        var sess = JSON.parse(localStorage.getItem("torcida.sessao") || "null");
        var clube = JSON.parse(localStorage.getItem("torcida_clube") || "null");
        time = (sess && sess.time) || (prefs && prefs.time) || (clube && clube.nome) || time;
      } catch (e) {}
      window.__torcidaPortalBoot = fetch("/api/portal", {
        headers: { "X-Torcida-Time": time, "Accept": "application/json" }
      }).then(function (r) { return r.json(); }).catch(function () { return null; });
    })();
  </script>
</head>
<body class="pagina-portal">
  <a class="pular" href="#principal">Ir para o conteúdo</a>
  <header class="topo" id="topo"></header>

  <main id="principal" class="conteudo">
    <section class="hoje-hero" id="hero" aria-labelledby="titulo">
      <p class="hoje-rotulo rotulo" id="rotuloHero" hidden><i class="ponto-vivo" hidden id="pontoVivo"></i><span id="rotuloTxt">Ao vivo</span></p>
      <div class="hoje-placar num-display" id="placarHero" hidden aria-live="polite"></div>
      <div>
        <h1 class="hoje-titulo titulo-display" id="titulo">Tudo do clube, agora</h1>
      </div>
      <p class="hoje-sub" id="lead">Carregando jogos e tabela do seu clube…</p>
      <p class="hoje-atualizado" id="atualizado" hidden></p>
      <div class="ticker-vivo" id="ticker" hidden><div class="ticker-pista" id="tickerPista"></div></div>
    </section>

    <div class="hoje-grid">
      <div>
        <a class="destaque-card" id="manchete" hidden target="_blank" rel="noopener"></a>
        <section class="resumo-bloco" id="resumoCard" hidden>
          <p class="rotulo"><span id="resumoEscudo"></span> Resumo do dia</p>
          <p id="resumoTexto"></p>
        </section>
      </div>
      <article class="holo-card card-holo" id="clube" aria-label="Seu clube">
        <i class="canto tl"></i><i class="canto tr"></i><i class="canto bl"></i><i class="canto br"></i>
        <div class="esqueleto esqueleto-card"></div>
      </article>
    </div>

    <section class="hoje-jogos" id="secAoVivo" hidden aria-label="Jogos ao vivo">
      <div class="trilho-cab">
        <h2 class="rotulo"><i class="ponto-vivo" aria-hidden="true"></i> Ao vivo agora</h2>
        <a class="rotulo com-ponto" href="/jogos.html">Ver todos</a>
      </div>
      <div class="grade-3" id="aoVivoGrade"></div>
    </section>

    <div class="trilho-cab">
      <h2 class="rotulo" id="trilhoTitulo">Jogos de hoje</h2>
      <span class="rotulo" id="dataHoje"></span>
    </div>
    <div class="trilho" id="trilho" aria-label="Trilho de jogos"></div>

    <section class="hoje-jogos" aria-label="Jogos de hoje">
      <div class="grade-3" id="hoje"><div class="esqueleto esqueleto-card"></div></div>
    </section>

    <section class="hoje-jogos" id="secProximos" hidden aria-label="Próximos jogos">
      <div class="trilho-cab">
        <h2 class="rotulo">Próximos jogos</h2>
        <a class="rotulo com-ponto" href="/jogos.html">Agenda completa</a>
      </div>
      <div class="grade-3" id="proximosGrade"></div>
    </section>
  </main>

  <div class="troca-tela" id="trocaTela" hidden>
    <div class="troca-topo">
      <input type="search" id="trocaBusca" placeholder="Buscar clube…" maxlength="60" autocomplete="off" />
      <button type="button" class="btn-pill" id="trocaFechar">Fechar</button>
    </div>
    <div class="troca-grade" id="trocaGrade"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/js/vendor-loader.js?v=27"></script>
  <script src="/app.js?v=27"></script>
  <script src="/auth.js?v=27"></script>
  <script src="/js/dados-estaticos.js?v=27"></script>
  <script src="/js/nav.js?v=27"></script>
  <script src="/portal.js?v=27"></script>
  <script>
    /* Se portal.js falhar, pinta um fallback mínimo com o boot do head */
    (function () {
      function fallback() {
        var boot = window.__torcidaPortalBoot;
        if (!boot) return;
        boot.then(function (p) {
          if (!p || !p.clube) return;
          var hojeEl = document.getElementById("hoje");
          if (hojeEl && hojeEl.querySelector(".esqueleto")) {
            var nome = (p.clube && p.clube.nome) || "seu clube";
            var tit = document.getElementById("titulo");
            if (tit) tit.textContent = "Tudo do " + nome + ", agora";
            var lead = document.getElementById("lead");
            if (lead) lead.textContent = "Tabela e jogos do " + nome + ".";
            var clube = document.getElementById("clube");
            if (clube) {
              var tab = p.clube.tabela || {};
              clube.innerHTML = "<div class=\"holo-topo\"><div><p class=\"rotulo\">Seu clube</p><h2>" + nome + "</h2>" +
                "<p class=\"muted pequeno\">" + (tab.posicao ? tab.posicao + "º · " + tab.pontos + " pts" : "") + "</p></div></div>";
            }
            var jogos = p.jogosHoje || [];
            hojeEl.innerHTML = jogos.length
              ? jogos.slice(0, 6).map(function (j) {
                  return "<div class=\"card-jogo\"><strong>" + (j.mandante || "") + " x " + (j.visitante || "") + "</strong>" +
                    "<span>" + (j.horario || j.status || "") + "</span></div>";
                }).join("")
              : "<div class=\"hoje-vazio\">Sem jogos listados agora. <a href=\"/jogos.html\">Ver agenda</a></div>";
            var trilho = document.getElementById("trilho");
            if (trilho && jogos.length) {
              trilho.innerHTML = jogos.slice(0, 10).map(function (j) {
                return "<span class=\"trilho-chip\">" + (j.mandante || "") + " x " + (j.visitante || "") + "</span>";
              }).join("");
            }
          }
        }).catch(function () {});
      }
      setTimeout(fallback, 3200);
    })();
  </script>
  <script>
    (function () {
      function load(src) {
        var s = document.createElement("script");
        s.src = src;
        s.defer = true;
        document.body.appendChild(s);
      }
      function depois() {
        load("/js/vendor/gsap.min.js");
        load("/js/vendor/lenis.min.js");
        load("/js/motion.js?v=27");
        load("/js/notif.js?v=27");
        load("/chat.js?v=27");
      }
      if ("requestIdleCallback" in window) requestIdleCallback(depois, { timeout: 2500 });
      else setTimeout(depois, 600);
    })();
  </script>
</body>
</html>
