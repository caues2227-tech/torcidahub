<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070c" />
  <title>Nação | Torcida</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/estilos.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/nacao.css?v=15" />
  <script src="/tema.js"></script>
</head>
<body class="pagina-nacao">
  <a class="pular" href="#principal">Ir para o conteúdo</a>
  <header class="topo" id="topo"></header>

  <main id="principal" class="conteudo nacao-social">
    <aside class="nacao-col nacao-esq" id="colEsq"></aside>

    <section class="nacao-col nacao-centro" aria-label="Feed da nação">
      <div class="chips-fade" id="filtros" role="tablist" aria-label="Filtros"></div>
      <div class="marquee-nacao" aria-hidden="true"><div class="marquee-pista" id="marquee"></div></div>
      <div class="composer" id="composer"></div>
      <div class="feed-lista" id="feed-noticias" aria-live="polite">
        <div class="esqueleto esqueleto-card"></div>
        <div class="esqueleto esqueleto-card"></div>
      </div>
    </section>

    <aside class="nacao-col nacao-dir" id="colDir"></aside>
  </main>

  <aside class="notif-drawer" id="notifDrawer" hidden aria-label="Notificações">
    <header>
      <h2>Notificações</h2>
      <button type="button" class="notif-fechar" id="notifFechar" aria-label="Fechar">×</button>
    </header>
    <ul id="notifLista"></ul>
    <footer>
      <button type="button" id="notifLerTodas">Marcar todas como lidas</button>
    </footer>
  </aside>
  <div class="notif-backdrop" id="notifBackdrop" hidden></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/js/vendor-loader.js?v=15"></script>
  <script src="/js/vendor/gsap.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js'"></script>
  <script src="/js/vendor/lenis.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js'"></script>
  <script src="/app.js?v=15"></script>
  <script src="/auth.js?v=15"></script>
  <script src="/js/nav.js?v=15"></script>
  <script src="/js/motion.js?v=15"></script>
  <script src="/js/data.js?v=15"></script>
  <script src="/js/nacao-live.js?v=15"></script>
  <script src="/js/notif.js?v=15"></script>
  <script src="/feed.js?v=15"></script>
  <script src="/chat.js?v=15"></script>
</body>
</html>
