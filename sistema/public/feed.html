<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070c" />
  <title>Nação | Torcida</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/css/fonts.css?v=24" />
  <link rel="stylesheet" href="/estilos.css?v=24" />
  <link rel="stylesheet" href="/css/tokens.css?v=24" />
  <link rel="stylesheet" href="/css/base.css?v=24" />
  <link rel="stylesheet" href="/css/nacao.css?v=24" />
  <script src="/tema.js"></script>
</head>
<body class="pagina-nacao">
  <a class="pular" href="#principal">Ir para o conteúdo</a>
  <header class="topo" id="topo"></header>

  <main id="principal" class="conteudo nacao-social">
    <aside class="nacao-col nacao-esq" id="colEsq"></aside>

    <section class="nacao-col nacao-centro" aria-label="Feed da nação">
      <div class="chips-fade" id="filtros" role="tablist" aria-label="Filtros"></div>
      <div class="marquee-nacao" aria-hidden="true"><div class="marquee-pista" id="marquee"></div></div>
      <div class="composer" id="composer"></div>
      <section class="painel-perfil" id="painelPerfil" hidden aria-label="Meu perfil">
        <header class="perfil-painel-cab">
          <div>
            <span class="selo-pagina">seu perfil</span>
            <h2 id="perfilTitulo">Meu perfil</h2>
            <p class="muted pequeno" id="perfilSub">Posts, quem você segue e sua nação.</p>
          </div>
          <button type="button" class="chip" id="fecharPerfil">Voltar ao feed</button>
        </header>
        <div class="perfil-painel-metas" id="perfilPainelMetas"></div>
        <div class="perfil-seguindo" id="perfilSeguindo"></div>
        <h3 class="perfil-posts-titulo">Seus posts</h3>
        <div class="feed-lista" id="perfilPosts"></div>
      </section>
      <div class="feed-lista" id="feed-noticias" aria-live="polite">
        <div class="esqueleto esqueleto-card"></div>
        <div class="esqueleto esqueleto-card"></div>
      </div>
    </section>

    <aside class="nacao-col nacao-dir" id="colDir"></aside>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/js/vendor-loader.js?v=24"></script>
  <script src="/js/vendor/gsap.min.js"></script>
  <script src="/js/vendor/lenis.min.js"></script>
  <script src="/app.js?v=24"></script>
  <script src="/auth.js?v=24"></script>
  <script src="/js/nav.js?v=24"></script>
  <script src="/js/motion.js?v=24"></script>
  <script src="/js/data.js?v=24"></script>
  <script src="/js/nacao-live.js?v=24"></script>
  <script src="/js/notif.js?v=24"></script>
  <script src="/feed.js?v=24"></script>
  <script src="/chat.js?v=24"></script>
</body>
</html>
