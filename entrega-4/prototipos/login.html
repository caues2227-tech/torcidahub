<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Login | Torcida</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="wrap">
    <div class="top"><div class="brand">TORCIDA<span>.</span></div></div>
    <div class="page auth">
      <h1>Entrar</h1>
      <p class="muted">Rede social só de futebol.</p>
      <form action="feed.html">
        <label>E-mail</label>
        <input type="email" value="caue@torcida.com" required />
        <label>Senha</label>
        <input type="password" value="123456" required />
        <button class="btn" type="submit">Entrar</button>
        <a class="btn ghost" href="cadastro.html">Criar conta</a>
      </form>
    </div>
  </div>
</body>
</html>
